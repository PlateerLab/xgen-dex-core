name: CI

# PR 에서만 돈다. 그리고 **바뀐 영역의 잡만** 돈다.
#
# 예전에는 PR·main 푸시·태그마다 전부 돌았다. 기능 PR → 버전업 PR → main 푸시
# (캐시 워밍 빌드) → 태그 릴리스로, 같은 데스크톱·안드로이드·iOS 빌드가 한
# 릴리스에 네다섯 번 만들어졌다. 이제는:
#   - main 푸시에는 돌지 않는다. PR 에서 검증된 코드가 그대로 들어간다.
#   - 버전 숫자·문서만 바꾼 변경은 무거운 잡을 돌리지 않는다(scripts/ci/changes.mjs).
#   - 버전 일치(version.mjs check)는 모든 PR 에서 본다 — 몇 초면 끝난다.
#   - 같은 PR 에 새로 푸시하면 이전 실행은 취소된다.
# 릴리스 빌드는 release.yml 한 곳에서 한 번만 만든다.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 영역 · 버전 일치
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      mobile: ${{ steps.areas.outputs.mobile }}
      native: ${{ steps.areas.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 모든 앱·패키지의 버전이 같은지
        run: node scripts/version.mjs check
      - name: 바뀐 영역
        id: areas
        run: node scripts/ci/changes.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  # ── 데스크톱 · CLI · VS Code · 패키지 ──
  verify:
    name: 계약 · 타입 · 테스트
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 데스크톱은 workspace 밖이라(electron) 따로 설치한다.
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --no-audit --no-fund

      # 산출물이 필요한 검사(확장 번들에 엔진이 없는지)가 있으므로 빌드가 먼저다.
      - name: 빌드
        run: |
          npm --prefix apps/cli run build
          npm --prefix apps/vscode run build
          npm --prefix apps/desktop run build

      - name: 계약 검사
        run: npm run contracts

      - name: 타입체크
        run: |
          npx tsc --noEmit -p packages/protocol/tsconfig.json
          npx tsc --noEmit -p packages/engine/tsconfig.json
          npx tsc --noEmit -p packages/rpc/tsconfig.json
          npx tsc --noEmit -p apps/cli/tsconfig.json
          npx tsc --noEmit -p apps/vscode/tsconfig.json

      - name: 테스트
        run: |
          npm --prefix packages/protocol test
          npm --prefix packages/engine test
          npm --prefix apps/cli test
          npm --prefix apps/vscode test
          npm --prefix apps/desktop test

  # ── 모바일 JS (별도 npm 프로젝트) ──
  mobile:
    name: 모바일 (타입 · 테스트)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci --no-audit --no-fund
      - run: npm --prefix apps/mobile test
      - run: npm --prefix apps/mobile run typecheck

  # ── 모바일 네이티브 컴파일 — 로컬 모듈·android·ios·의존성이 바뀐 PR 만 ──
  #
  # 네이티브 코드의 컴파일 오류가 릴리스 태그에서야 드러나지 않게 머지 전에 본다.
  # 캐시는 릴리스(main 에서 실행)가 만든 것을 읽기만 한다.
  android:
    name: 안드로이드 컴파일
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: npm --prefix apps/mobile ci --no-audit --no-fund
      # 서명 시크릿이 없으면 build.gradle 이 디버그 키로 폴백한다 — 컴파일 확인에는 충분하다.
      - name: APK 빌드
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

  ios:
    name: iOS 컴파일
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Xcode 26(macos-latest)의 clang 은 RN 0.79 의 fmt 와 비호환 — Xcode 16 이 있는 macos-15.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Xcode 16 선택
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm --prefix apps/mobile ci --no-audit --no-fund
      - name: ccache 설치
        run: brew install ccache || true
      - uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ios-ccache-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: ios-ccache-
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json') }}
          restore-keys: ios-pods-
      # 로컬 모듈(modules/)은 여기서 Pods 에 잡힌다.
      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install
      - name: ccache 구성 (절대경로 래퍼)
        run: |
          # RN 의 ccache 래퍼는 Xcode 가 컴파일러 프로세스에 CCACHE_BINARY 를 넘기지
          # 않아 조용히 순정 clang 으로 폴백한다 — 절대경로 래퍼를 CC/CXX 로 강제한다.
          CCACHE=$(brew --prefix)/bin/ccache
          CLANG=$(xcrun -f clang); CLANGXX=$(xcrun -f clang++)
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$CLANG"   > /tmp/ccache-clang.sh
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$CLANGXX" > /tmp/ccache-clang++.sh
          chmod +x /tmp/ccache-clang.sh /tmp/ccache-clang++.sh
          $CCACHE --set-config sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          $CCACHE --set-config file_clone=true
          $CCACHE --set-config depend_mode=true
          $CCACHE --set-config inode_cache=true
      - name: Xcode 빌드
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace XGENDex.xcworkspace -scheme XGENDex \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CC=/tmp/ccache-clang.sh CXX=/tmp/ccache-clang++.sh \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
