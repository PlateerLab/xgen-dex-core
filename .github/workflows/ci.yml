name: CI

# PR 에서만 돈다. 그리고 **바뀐 영역의 잡만** 돈다.
#
# 예전에는 PR·main 푸시·태그마다 전부 돌았다. 기능 PR → 버전업 PR → main 푸시
# (캐시 워밍 빌드) → 태그 릴리스로, 같은 데스크톱·안드로이드·iOS 빌드가 한
# 릴리스에 네다섯 번 만들어졌다. 이제는:
#   - main 푸시에는 돌지 않는다. PR 에서 검증된 코드가 그대로 들어간다.
#   - 버전 숫자·문서만 바꾼 변경은 무거운 잡을 돌리지 않는다(scripts/ci/changes.mjs).
#   - 버전 일치(version.mjs check)는 모든 PR 에서 본다 — 몇 초면 끝난다.
#   - 이 파일을 고친 PR 은 **고친 잡만** 한 번 더 돈다(공통 부분을 고쳤을 때만 전부).
#   - 같은 PR 에 새로 푸시하면 이전 실행은 취소된다.
# 릴리스 빌드는 release.yml 한 곳에서 한 번만 만든다.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 영역 · 버전 일치
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.areas.outputs.core }}
      mobile: ${{ steps.areas.outputs.mobile }}
      native: ${{ steps.areas.outputs.native }}
      engine: ${{ steps.areas.outputs.engine }}
      xdpack: ${{ steps.areas.outputs.xdpack }}
      deskpack: ${{ steps.areas.outputs.deskpack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 모든 앱·패키지의 버전이 같은지
        run: node scripts/version.mjs check
      - name: 바뀐 영역
        id: areas
        run: node scripts/ci/changes.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  # ── 데스크톱 · CLI · VS Code · 패키지 ──
  verify:
    name: 계약 · 타입 · 테스트
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 데스크톱은 workspace 밖이라(electron) 따로 설치한다.
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
      # XD 도 따로 — 화면은 Dex 의 코드·의존을 쓰므로 데스크톱 설치 뒤에 둔다. 이 잡은 실행하지 않으니
      # Electron 바이너리는 받지 않는다.
      - run: npm --prefix apps/xd ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # 산출물이 필요한 검사(확장 번들에 엔진이 없는지)가 있으므로 빌드가 먼저다.
      - name: 빌드
        run: |
          npm --prefix apps/cli run build
          npm --prefix apps/vscode run build
          npm --prefix apps/desktop run build
          npm --prefix apps/xd run build
          npm --prefix packages/ide run build

      - name: 계약 검사
        run: npm run contracts

      - name: 타입체크
        run: |
          npx tsc --noEmit -p packages/protocol/tsconfig.json
          npx tsc --noEmit -p packages/engine/tsconfig.json
          npx tsc --noEmit -p packages/rpc/tsconfig.json
          npx tsc --noEmit -p packages/ide/tsconfig.json
          npx tsc --noEmit -p apps/cli/tsconfig.json
          npx tsc --noEmit -p apps/vscode/tsconfig.json
          npx tsc --noEmit -p apps/desktop/tsconfig.json
          npx tsc --noEmit -p apps/xd/tsconfig.json

      - name: 테스트
        run: |
          npm --prefix packages/protocol test
          npm --prefix packages/engine test
          npm --prefix packages/ide test
          npm --prefix apps/cli test
          npm --prefix apps/vscode test
          npm --prefix apps/desktop test

  # ── XD 앱 — Electron 43 과 같은 Node 24(node:sqlite)로 단위 시험, 동봉 엔진으로 실제 앱 E2E ──
  #
  # 화면은 Dex 의 코드를 같이 쓰므로 Dex 쪽 변경(core)에서도 돈다. E2E 는 실제 Electron 을 띄워 가짜 LLM 으로
  # 턴을 돌리고, 껐다 켜도 대화가 이어지는지·위험 명령이 확인 창을 거치는지 본다.
  xd-app:
    name: XD 앱 (시험 · E2E)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: apps/xd/engine/.cache/python
          key: xd-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/xd/engine/bundle/bundle.json') }}
      - run: npm ci --no-audit --no-fund
      # 화면 코드가 Dex 의 의존(react 등)을 쓴다. Dex 의 Electron 은 여기서 쓰지 않는다.
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm --prefix apps/xd ci --no-audit --no-fund
      - name: 단위 시험
        run: npm --prefix apps/xd test
      - name: 동봉 엔진
        run: node apps/xd/scripts/bundle-engine.mjs --skip-verify
      - name: 빌드
        run: npm --prefix apps/xd run build
      # XD_E2E_INSTALL — 앱의 설치기가 claude·codex 를 공식 배포처에서 받아(sha256 확인) 그 CLI 로 턴을 돌린다.
      - name: E2E (실제 앱)
        env:
          XD_E2E_INSTALL: '1'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          xvfb-run -a npm --prefix apps/xd run e2e

  # ── XD 엔진 (동봉 Python) — 세 OS 에서 동봉본을 만들고, 그 인터프리터로 엔진 시험을 돌린다 ──
  #
  # 엔진은 이 PC 의 셸(Windows 는 PowerShell)·파일·프로세스를 다룬다 — 리눅스에서만 보면 Windows 의
  # 경로·프로세스 종료·stdio 차이를 릴리스에서야 안다.
  xd-engine:
    name: XD 엔진 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # pytest 를 받을 때만 쓴다 — 시험은 동봉된 인터프리터가 돌린다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: apps/xd/engine/.cache/python
          key: xd-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/xd/engine/bundle/bundle.json') }}
      - name: 동봉본 만들기 · 검증
        run: node apps/xd/scripts/bundle-engine.mjs
      - name: pytest 받기
        shell: bash
        run: python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/pytest-lib" pytest==9.1.1
      # 실제 claude·codex — CLI 턴 시험(tests/test_cli_turns.py)이 건너뛰지 않게. 모델은 시험의 가짜 서버다.
      - name: 실제 CLI (리눅스)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          V=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/openai/codex/releases/latest | sed -E 's#.*/rust-v##')
          mkdir -p "$HOME/.local/codex-cli/bin"
          curl -fsSL "https://github.com/openai/codex/releases/download/rust-v$V/codex-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$HOME/.local/codex-cli/bin"
          mv "$HOME/.local/codex-cli/bin/codex-x86_64-unknown-linux-musl" "$HOME/.local/codex-cli/bin/codex"
          "$HOME/.local/bin/claude" --version
          "$HOME/.local/codex-cli/bin/codex" --version
      - name: 엔진 시험 (동봉 인터프리터)
        shell: bash
        working-directory: apps/xd/engine
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          DIR="dist/$(node -p "process.platform + '-' + process.arch")/python"
          if [ -f "$DIR/python.exe" ]; then PY="$DIR/python.exe"; else PY="$DIR/bin/python3"; fi
          PYTHONPATH="$RUNNER_TEMP/pytest-lib" "$PY" -m pytest -q -p no:cacheprovider tests

  # ── XD 설치본 — 세 OS(맥은 두 아키텍처)에서 실제 설치본을 만들고, 그 설치본으로 턴을 돌린다 ──
  #
  # 릴리스와 같은 길이다(release.yml 의 xd 잡). 설치본에 실린 엔진(resources/engine/python)이 그 OS 에서 뜨는지,
  # Windows 는 설치 → 다시 설치(업데이트) → 제거 뒤에도 설치 폴더(= XD 루트)의 workspace·.xd 가 남는지 본다.
  # 설치본에 닿는 것이 바뀔 때만 돈다(changes.mjs 의 xdpack).
  xd-package:
    name: XD 설치본 (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.xdpack == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, flag: --linux, exe: apps/xd/release/linux-unpacked/xd }
          - { name: windows-x64, os: windows-latest, flag: --win, exe: apps/xd/release/win-unpacked/XD.exe }
          - { name: macos-arm64, os: macos-latest, flag: --mac --arm64, exe: apps/xd/release/mac-arm64/XD.app/Contents/MacOS/XD }
          - { name: macos-x64, os: macos-15-intel, flag: --mac --x64, exe: apps/xd/release/mac/XD.app/Contents/MacOS/XD }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: apps/xd/engine/.cache/python
          key: xd-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/xd/engine/bundle/bundle.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm --prefix apps/xd ci --no-audit --no-fund
      - name: 동봉 엔진
        run: node apps/xd/scripts/bundle-engine.mjs
      - name: 빌드
        run: npm --prefix apps/xd run build
      - name: 설치본
        working-directory: apps/xd
        run: npx --no-install electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: 설치본으로 턴
        shell: bash
        env:
          XD_E2E_PACKAGED: ${{ github.workspace }}/${{ matrix.exe }}
        run: |
          command -v xvfb-run >/dev/null || [ "$RUNNER_OS" != Linux ] || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          if [ "$RUNNER_OS" = Linux ]; then RUN="xvfb-run -a"; else RUN=""; fi
          cd apps/xd && $RUN npx --no-install tsx --test e2e/packaged.e2e.ts
      - name: Windows 설치·업데이트·제거 — 루트 보존
        if: runner.os == 'Windows'
        run: node apps/xd/scripts/check-installer.mjs

  # ── Dex 설치본 — 릴리스와 같은 설치본을 만들어 그 설치본으로 띄우고, Windows 는 처음 설치·업데이트·제거 ──
  # 설치본에 닿는 것(설치 설정·NSIS·의존성·이 확인)이 바뀔 때만 돈다(changes.mjs 의 deskpack). 처음 하는 사용자별
  # 설치는 Windows 11 24H2·Server 2025(windows-latest)에서 electron-builder 26.12 아래의 템플릿이 죽던 길이다.
  desktop-package:
    name: Dex 설치본 (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.deskpack == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, flag: --linux, exe: apps/desktop/release/linux-unpacked/xgen-dex }
          - { name: windows-x64, os: windows-latest, flag: --win, exe: apps/desktop/release/win-unpacked/XGen-Dex.exe }
          - { name: macos-arm64, os: macos-latest, flag: --mac, exe: apps/desktop/release/mac-arm64/XGen-Dex.app/Contents/MacOS/XGen-Dex }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
      - name: 빌드
        run: npm --prefix apps/desktop run build
      - name: 설치본
        working-directory: apps/desktop
        run: npx --no-install electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: 설치본으로 띄우기
        shell: bash
        env:
          DEX_E2E_PACKAGED: ${{ github.workspace }}/${{ matrix.exe }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # keytar 가 여는 libsecret(deb 의 depends 에 있다), 화면 없는 X
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libsecret-1-0
            RUN="xvfb-run -a"
          else
            RUN=""
          fi
          cd apps/desktop && $RUN npx --no-install tsx --test e2e/packaged.e2e.ts
      - name: Windows 처음 설치·업데이트·제거
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/check-installer.mjs
  # ── 모바일 JS (별도 npm 프로젝트) ──
  mobile:
    name: 모바일 (타입 · 테스트)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci --no-audit --no-fund
      - run: npm --prefix apps/mobile test
      - run: npm --prefix apps/mobile run typecheck

  # ── 모바일 네이티브 컴파일 — 로컬 모듈·android·ios·의존성이 바뀐 PR 만 ──
  #
  # 네이티브 코드의 컴파일 오류가 릴리스 태그에서야 드러나지 않게 머지 전에 본다.
  # 캐시는 릴리스(main 에서 실행)가 만든 것을 읽기만 한다.
  android:
    name: 안드로이드 컴파일
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: npm --prefix apps/mobile ci --no-audit --no-fund
      # 서명 시크릿이 없으면 build.gradle 이 디버그 키로 폴백한다 — 컴파일 확인에는 충분하다.
      - name: APK 빌드
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

  ios:
    name: iOS 컴파일
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Xcode 26(macos-latest)의 clang 은 RN 0.79 의 fmt 와 비호환 — Xcode 16 이 있는 macos-15.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Xcode 16 선택
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm --prefix apps/mobile ci --no-audit --no-fund
      - name: ccache 설치
        run: brew install ccache || true
      - uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ios-ccache-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: ios-ccache-
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json') }}
          restore-keys: ios-pods-
      # 로컬 모듈(modules/)은 여기서 Pods 에 잡힌다.
      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install
      - name: ccache 구성 (절대경로 래퍼)
        run: |
          # RN 의 ccache 래퍼는 Xcode 가 컴파일러 프로세스에 CCACHE_BINARY 를 넘기지
          # 않아 조용히 순정 clang 으로 폴백한다 — 절대경로 래퍼를 CC/CXX 로 강제한다.
          CCACHE=$(brew --prefix)/bin/ccache
          CLANG=$(xcrun -f clang); CLANGXX=$(xcrun -f clang++)
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$CLANG"   > /tmp/ccache-clang.sh
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$CLANGXX" > /tmp/ccache-clang++.sh
          chmod +x /tmp/ccache-clang.sh /tmp/ccache-clang++.sh
          $CCACHE --set-config sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          $CCACHE --set-config file_clone=true
          $CCACHE --set-config depend_mode=true
          $CCACHE --set-config inode_cache=true
      - name: Xcode 빌드
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace XGENDex.xcworkspace -scheme XGENDex \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CC=/tmp/ccache-clang.sh CXX=/tmp/ccache-clang++.sh \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
