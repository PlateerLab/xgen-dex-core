name: Release

# 세 산출물을 **한 릴리스**로 낸다 — 데스크톱 설치본(3 OS) · CLI 패키지 · VSCode 확장.
#
# 하나의 릴리스인 이유: 셋이 같은 코어를 공유하므로 버전이 갈라지면 "내 CLI 는
# 되는데 확장은 안 된다"가 되고, 그때 어느 조합이 검증된 것인지 아무도 모른다.
# 태그 하나 = 검증된 조합 하나다.
#
# 릴리스는 **이 워크플로 한 번**이다: Actions → Release → Run workflow(main) 에서
# 버전(patch · minor · major 또는 x.y.z)을 넣으면
#   1) prepare 가 모든 앱·패키지의 버전을 한 값으로 올려 main 에 커밋하고 태그를 단다
#   2) 그 태그로 데스크톱·CLI·확장·안드로이드·iOS 를 **한 번씩** 만들어 발행한다.
# 버전업 PR 도, main 푸시 CI 도 없다 — 같은 빌드를 여러 번 만들던 길을 없앴다.
# (GITHUB_TOKEN 으로 푸시한 커밋·태그는 다른 워크플로를 깨우지 않는다.)
#
# main 에서 돌기 때문에 여기서 만든 캐시(gradle·ccache·Pods)는 다음 릴리스와
# PR 의 네이티브 컴파일이 그대로 읽는다 — 캐시만 데우려는 별도 빌드가 필요 없다.
#
# 사람이 태그를 직접 올린 경우(v*)에도 돈다. 그때는 버전을 올리지 않고 태그의
# 버전이 모든 앱·패키지에서 같은지만 확인한다.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '새 버전 — patch · minor · major 또는 x.y.z'
        required: true
        default: minor
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 버전 올리기 · 태그 (수동 실행) / 태그 확인 (태그 푸시) ──
  prepare:
    name: 버전 · 태그
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 버전 올리기 · 커밋 · 태그
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::릴리스는 main 에서만 실행합니다 (지금: $GITHUB_REF)"; exit 1
          fi
          VER=$(node scripts/version.mjs set "$BUMP")
          node scripts/version.mjs check
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::v$VER 태그가 이미 있습니다"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): $VER"
          git tag -a "v$VER" -m "v$VER"
          git push origin HEAD:main "v$VER"
          echo "TAG=v$VER" >> "$GITHUB_ENV"
      - name: 태그의 버전 확인
        if: github.event_name == 'push'
        run: |
          node scripts/version.mjs check
          VER=$(node -p "require('./package.json').version")
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 버전(v$VER)이 다릅니다"; exit 1
          fi
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - id: tag
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # ── 데스크톱 설치본 (OS 별로 그 OS 에서 빌드해야 한다) ──
  desktop:
    name: 데스크톱 (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + blockmap 은 electron-updater 의 피드다 — 설치본과 함께
          # 올려야 자동 업데이트가 새 버전을 찾는다.
          - os: ubuntu-latest
            flag: --linux
            exe: apps/desktop/release/linux-unpacked/xgen-dex
            glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/latest-linux.yml
          - os: windows-latest
            flag: --win
            exe: apps/desktop/release/win-unpacked/XGen-Dex.exe
            glob: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest.yml
          - os: macos-latest
            flag: --mac
            exe: apps/desktop/release/mac-arm64/XGen-Dex.app/Contents/MacOS/XGen-Dex
            glob: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # electron-builder 26 의 @electron/rebuild 는 Node 22.12 이상이 든다(keytar 를 Electron 에 맞춰 다시 짓는다).
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      # 루트 install 은 packages/* 의 의존(ws · MCP SDK)을 놓는다 — 데스크톱이
      # 그것을 소스로 번들하므로 둘 다 필요하다.
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --no-audit --no-fund

      - name: 빌드
        run: npm --prefix apps/desktop run build

      - name: 패키징
        working-directory: apps/desktop
        run: npx --no-install electron-builder ${{ matrix.flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 발행 전에 CI(desktop-package)와 같은 확인 — 설치본으로 띄우기, Windows 처음 설치·업데이트·제거·이전 릴리스에서 올라오기.
      - name: 설치본으로 띄우기
        shell: bash
        env:
          DEX_E2E_PACKAGED: ${{ github.workspace }}/${{ matrix.exe }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libsecret-1-0
            RUN="xvfb-run -a"
          else
            RUN=""
          fi
          cd apps/desktop && $RUN npx --no-install tsx --test e2e/packaged.e2e.ts
      - name: Windows 처음 설치·업데이트·제거·올라오기
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/desktop/scripts/check-installer.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # ── XD (서버 없이 이 PC 에서 에이전트를 돌리는 앱) — Dex 와 같은 버전, 같은 릴리스 ──
  #
  # 설치본마다 그 OS·아키텍처의 Python 엔진이 실린다(맥은 arm64·x64 따로). 업데이트 정보는 채널 xd
  # (xd.yml · xd-mac.yml · xd-linux.yml) — Dex 의 latest*.yml 과 겹치지 않는다. 맥 x64 는 dmg 만 올린다(xd-mac.yml 은
  # 하나여야 하고, 맥 업데이트는 버전만 보고 그 아키텍처의 dmg 를 받게 한다 — updater.ts).
  # 발행 전에 CI 와 같은 확인을 한다: 설치본으로 턴, Windows 설치·업데이트·제거 뒤 루트 보존.
  xd:
    name: XD (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            flag: --linux
            exe: apps/xd/release/linux-unpacked/xd
            glob: |
              apps/xd/release/XGen-XD-*.AppImage
              apps/xd/release/XGen-XD-*.deb
              apps/xd/release/xd-linux.yml
          - name: windows-x64
            os: windows-latest
            flag: --win
            exe: apps/xd/release/win-unpacked/XD.exe
            glob: |
              apps/xd/release/XGen-XD-Setup-*.exe
              apps/xd/release/XGen-XD-Setup-*.exe.blockmap
              apps/xd/release/xd.yml
          - name: macos-arm64
            os: macos-latest
            flag: --mac --arm64
            exe: apps/xd/release/mac-arm64/XD.app/Contents/MacOS/XD
            glob: |
              apps/xd/release/XGen-XD-*-arm64.dmg
              apps/xd/release/XGen-XD-*-arm64.dmg.blockmap
              apps/xd/release/xd-mac.yml
          - name: macos-x64
            os: macos-15-intel
            flag: --mac --x64
            exe: apps/xd/release/mac/XD.app/Contents/MacOS/XD
            glob: |
              apps/xd/release/XGen-XD-*-x64.dmg
              apps/xd/release/XGen-XD-*-x64.dmg.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/cache@v4
        with:
          path: apps/xd/engine/.cache/python
          key: xd-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/xd/engine/bundle/bundle.json') }}
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix apps/desktop ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm --prefix apps/xd ci --no-audit --no-fund
      - name: 동봉 엔진
        run: node apps/xd/scripts/bundle-engine.mjs
      - name: 빌드
        run: npm --prefix apps/xd run build
      - name: 패키징
        working-directory: apps/xd
        run: npx --no-install electron-builder ${{ matrix.flag }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: 설치본으로 턴
        shell: bash
        env:
          XD_E2E_PACKAGED: ${{ github.workspace }}/${{ matrix.exe }}
        run: |
          command -v xvfb-run >/dev/null || [ "$RUNNER_OS" != Linux ] || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          if [ "$RUNNER_OS" = Linux ]; then RUN="xvfb-run -a"; else RUN=""; fi
          cd apps/xd && $RUN npx --no-install tsx --test e2e/packaged.e2e.ts
      - name: Windows 설치·업데이트·제거 — 루트 보존
        if: runner.os == 'Windows'
        run: node apps/xd/scripts/check-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: xd-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # ── CLI · VSCode 확장 (플랫폼 무관) ──
  packages:
    name: CLI + 확장
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund

      # `npm --prefix` 는 pack 의 --pack-destination 과 같이 쓰면 경로를 못 찾는다
      # (prefix 는 설치 루트를 바꾸지 cwd 를 바꾸지 않는다). 디렉터리에서 직접 돈다.
      - name: CLI tarball
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-release"
          npm --prefix apps/cli run build
          cd apps/cli && npm pack --pack-destination "$GITHUB_WORKSPACE/dist-release"

      - name: 확장 .vsix
        run: |
          npm --prefix apps/vscode run build
          cd apps/vscode && npx --yes @vscode/vsce package --no-dependencies \
            --out "$GITHUB_WORKSPACE/dist-release/"

      # 확장이 엔진을 품지 않았는지 — 여기서 막지 않으면 설치 시점에야 터진다.
      - name: RPC 경계 확인
        run: npm run contracts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist-release/*
          if-no-files-found: error

  # ── 모바일 (React Native) ──
  #
  # 데스크톱/CLI/확장과 **독립**이다 — 별도 npm 프로젝트(apps/mobile, Expo/RN)를
  # 여기서만 빌드하며, 다른 잡의 입력/산출물에 관여하지 않는다. 네이티브
  # 프로젝트(android/, ios/)는 prebuild 결과물을 커밋해 두었다 — CI 는 재생성
  # 없이 그대로 빌드한다(결정적).
  android:
    needs: prepare
    name: 모바일 — 안드로이드 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # gradle 배포판 + 의존성 + 빌드 캐시를 런 사이에 재사용 — 콜드 다운로드 제거.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - run: npm --prefix apps/mobile ci --no-audit --no-fund

      - name: 타입 + 테스트
        run: |
          npm --prefix apps/mobile test
          npm --prefix apps/mobile run typecheck

      # ⚠ 서명 키는 **릴리스마다 같아야** 안드로이드가 업데이트 설치를 허용한다
      # (키가 다르면 '패키지가 기존 패키지와 충돌' — 삭제 후 재설치 강요, 실사고).
      # 고정 키는 저장소 시크릿(ANDROID_KEYSTORE_B64 등)에 있다 — 레포가 public
      # 이라 커밋 금지. 시크릿이 없으면(포크 등) 임시 키로 폴백하되 경고한다.
      - name: 서명 키 준비
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/xgen-dex.keystore
            echo "고정 릴리스 키 사용 — 기존 설치 위 업데이트 가능"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 시크릿이 없어 임시 키로 서명합니다 — 이 APK 는 기존 설치 위에 업데이트되지 않습니다."
            keytool -genkeypair -v -keystore /tmp/xgen-dex.keystore -alias xgen-dex -keyalg RSA -keysize 2048 -validity 3650 -storepass xgen-dex-release -keypass xgen-dex-release -dname "CN=XGEN Dex, O=PlateerLab"
          fi

      - name: APK 빌드
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: /tmp/xgen-dex.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'xgen-dex-release' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'xgen-dex' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'xgen-dex-release' }}

      - name: 서명 검증 (지문 로그)
        run: |
          keytool -printcert -jarfile apps/mobile/android/app/build/outputs/apk/release/app-release.apk | grep -E "SHA-?256" | head -2

      - name: 이름 정리
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk              "dist-android/XGen-Dex-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error

  # ── 모바일 — iOS (무서명 빌드) ──
  #
  # Apple 배포 서명(개발자 인증서/프로비저닝)은 시크릿이 없으면 불가능하다.
  # 여기서는 크로스플랫폼 빌드가 **살아 있음을 보증**하고, 무서명 .ipa 를
  # 자산으로 남긴다(사내 재서명/TestFlight 파이프라인의 입력). Apple 툴체인
  # 변동으로 릴리스 전체가 막히지 않도록 실패는 릴리스를 막지 않는다.
  ios:
    needs: prepare
    name: 모바일 — iOS (무서명)
    # macos-latest(=Xcode 26)의 새 clang 은 RN 0.79 가 쓰는 fmt 의 consteval
    # 코드와 비호환(빌드 실패 실측). Xcode 16 이 실려 있는 macos-15 로 고정한다.
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Xcode 16 선택
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm --prefix apps/mobile ci --no-audit --no-fund

      # ccache — RN 코어(C++) 재컴파일이 iOS 잡의 대부분이다. Podfile 이
      # apple.ccacheEnabled 로 컴파일러를 ccache 로 감싸므로, 캐시 디렉터리만
      # 런 사이에 보존하면 두 번째 릴리스부터 컴파일이 캐시 히트로 끝난다.
      - name: ccache 설치
        run: brew install ccache || true
      # ⚠ CCACHE_DIR env 는 쓰지 않는다 — xcodebuild 의 컴파일은 별도 빌드 서비스
      # 프로세스에서 돌아 CLI env 를 물려받지 않는다(실측: 커스텀 디렉터리 0.0GiB).
      # macOS 기본 캐시 디렉터리를 그대로 쓰고 그 경로를 저장한다.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ios-ccache-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: ios-ccache-
      - uses: actions/cache@v4
        with:
          path: |
            apps/mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ hashFiles('apps/mobile/package-lock.json', 'apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json') }}
          restore-keys: ios-pods-

      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install
      - name: ccache 구성 (절대경로 래퍼)
        run: |
          # RN 의 ccache 래퍼는 CCACHE_BINARY '빌드 설정'에 의존하는데, Xcode 가
          # 컴파일러 프로세스에 이를 env 로 넘기지 않아 조용히 순정 clang 으로
          # 폴백한다(실측: 캐시 활동 0). 절대경로를 박은 래퍼를 만들어
          # xcodebuild CLI 인자(CC/CXX)로 전 타깃에 강제한다 — env 의존 0.
          CCACHE=$(brew --prefix)/bin/ccache
          CLANG=$(xcrun -f clang); CLANGXX=$(xcrun -f clang++)
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$CLANG"   > /tmp/ccache-clang.sh
          printf '#!/bin/sh\nexec %s %s "$@"\n' "$CCACHE" "$CLANGXX" > /tmp/ccache-clang++.sh
          chmod +x /tmp/ccache-clang.sh /tmp/ccache-clang++.sh
          # RN 권장 sloppiness — 전역 설정에 기록해 래퍼/통계가 같은 구성을 본다.
          $CCACHE --set-config sloppiness=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          $CCACHE --set-config file_clone=true
          $CCACHE --set-config depend_mode=true
          $CCACHE --set-config inode_cache=true
      - name: ccache 통계 초기화
        run: ccache -z || true
      - name: Xcode 빌드 (서명 없이)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace XGENDex.xcworkspace -scheme XGENDex \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CC=/tmp/ccache-clang.sh CXX=/tmp/ccache-clang++.sh \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: ccache 통계
        run: ccache -s || true
      - name: 무서명 IPA 패키징
        run: |
          VER=$(node -p "require('./package.json').version")
          APP=$(find apps/mobile/ios/build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p /tmp/Payload dist-ios
          cp -R "$APP" /tmp/Payload/
          (cd /tmp && zip -qry "$OLDPWD/dist-ios/XGen-Dex-$VER-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist-ios/*.ipa
          if-no-files-found: error

  # ── npm 배포 ──
  #
  # GitHub Release 와 **따로** 두는 이유: npm 은 같은 버전을 두 번 올릴 수 없다.
  # 한 잡에 묶으면 재실행할 때마다 'You cannot publish over the previously
  # published versions' 로 릴리스 전체가 빨개진다. 이미 올라간 버전이면 조용히
  # 건너뛰고 넘어가는 것이 맞다 — 그건 실패가 아니라 '할 일이 없음' 이다.
  #
  # 데스크톱 설치본과 .vsix 는 npm 에 올리지 않는다. 설치본은 Release 자산이고,
  # 확장은 VS Marketplace 가 자기 자리다.
  npm:
    name: npm 배포
    needs: [prepare, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # --provenance 는 이 권한 없이는 실패한다. 출처 증명이 붙으면 npm 페이지에
      # "이 커밋의 이 워크플로가 만들었다" 가 표시되고, 받는 쪽이 그것을 검증할 수 있다.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund

      # 배포물은 번들이라 소스가 필요 없다 — 하지만 **여기서 다시 만든다.**
      # 다른 잡이 만든 것을 받아 쓰면 그 사이에 무엇이 바뀌었는지 보장할 수 없다.
      - name: 빌드
        run: npm --prefix apps/cli run build

      - name: 이미 올라간 버전인지 확인
        id: check
        run: |
          NAME=$(node -p "require('./apps/cli/package.json').name")
          VER=$(node -p "require('./apps/cli/package.json').version")
          echo "name=$NAME"     >> "$GITHUB_OUTPUT"
          echo "version=$VER"   >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER 는 이미 npm 에 있습니다 — 배포를 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포
        if: steps.check.outputs.exists == 'false'
        working-directory: apps/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 설치되는지 실제로 확인
        if: steps.check.outputs.exists == 'false'
        run: |
          # 레지스트리 전파에 잠깐 걸린다. 올라간 것을 **정말로 깔아서** 실행해 본다 —
          # publish 성공만으로는 bin 이 붙었는지, 의존이 빠지지 않았는지 알 수 없다.
          # 레지스트리 전파는 분 단위로 걸릴 수 있다. 짧게 기다리고 그냥 설치로
          # 넘어가면, publish 는 멀쩡한데 ETARGET 으로 릴리스가 빨개진다
          # (2026-09-17 v1.47.0: 60초로는 모자랐고 배포 자체는 정상이었다).
          # 그래서 (1) 캐시를 타지 않게 --prefer-online 으로 묻고, (2) 보일 때까지
          # 최대 10분 기다리고, (3) 끝내 안 보이면 **그 사실을 말하고** 멈춘다
          # (2026-09-28 v1.61.0: 프로토콜이 5분 넘게 안 보여 IDE 배포까지 멈췄다).
          seen=""
          for i in $(seq 1 40); do
            if npm view --prefer-online "${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}" version >/dev/null 2>&1; then
              seen=1
              echo "레지스트리 반영 확인 (약 $(( (i - 1) * 15 ))초 대기)"
              break
            fi
            sleep 15
          done
          if [ -z "$seen" ]; then
            echo "::error::${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} 가 10분 안에 레지스트리에 보이지 않습니다. publish 는 성공했을 수 있으니 npm 쪽 상태를 확인하세요."
            exit 1
          fi
          npm i -g "${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}"
          dex --version
          xgen-dex --version

      # ── 프로토콜 (xgen-dex-protocol) ────────────────────────────────
      #
      # 모노레포 안에서는 `@dex/protocol` 이지만 밖으로는 `xgen-dex-protocol` 로
      # 나간다. npm 에 `@xgen` org 권한이 없어(403 실측) 기존 `xgen-dex-cli` 와
      # 같은 무스코프 규약을 따른다. 내부 별칭은 tsconfig·vite·metro 에 박혀 있어
      # 이름을 바꾸면 90여 파일과 번들러 설정이 함께 움직인다 — 얻는 것 없이
      # 위험만 큰 변경이라, 밖으로 나가는 이름만 정한다.
      #
      # 이 패키지가 밖으로 나가는 이유: 웹(xgen-frontend)이 같은 계약으로 서버와
      # 말해야 한다. 지금은 표면마다 해석기를 새로 쓰고 있어 새 이벤트가 생기면
      # 안 고친 곳이 조용히 무시한다.
      - name: 프로토콜 빌드
        run: npm --prefix packages/protocol run build

      - name: 프로토콜 — 이미 올라간 버전인지 확인
        id: proto
        run: |
          NAME=$(node -p "require('./packages/protocol/dist-pkg/package.json').name")
          VER=$(node -p "require('./packages/protocol/dist-pkg/package.json').version")
          echo "name=$NAME"   >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER 는 이미 npm 에 있습니다 — 배포를 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 프로토콜 배포
        if: steps.proto.outputs.exists == 'false'
        working-directory: packages/protocol/dist-pkg
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 프로토콜 — 설치해서 실제로 불러 본다
        if: steps.proto.outputs.exists == 'false'
        run: |
          # publish 성공은 "올라갔다" 일 뿐이다. 소비자는 루트와 서브경로를 둘 다
          # import 하므로, 그 둘이 실제로 해석되는지 여기서 확인한다.
          # 레지스트리 전파는 분 단위로 걸릴 수 있다. 짧게 기다리고 그냥 설치로
          # 넘어가면, publish 는 멀쩡한데 ETARGET 으로 릴리스가 빨개진다
          # (2026-09-17 v1.47.0: 60초로는 모자랐고 배포 자체는 정상이었다).
          # 그래서 (1) 캐시를 타지 않게 --prefer-online 으로 묻고, (2) 보일 때까지
          # 최대 10분 기다리고, (3) 끝내 안 보이면 **그 사실을 말하고** 멈춘다
          # (2026-09-28 v1.61.0: 프로토콜이 5분 넘게 안 보여 IDE 배포까지 멈췄다).
          seen=""
          for i in $(seq 1 40); do
            if npm view --prefer-online "${{ steps.proto.outputs.name }}@${{ steps.proto.outputs.version }}" version >/dev/null 2>&1; then
              seen=1
              echo "레지스트리 반영 확인 (약 $(( (i - 1) * 15 ))초 대기)"
              break
            fi
            sleep 15
          done
          if [ -z "$seen" ]; then
            echo "::error::${{ steps.proto.outputs.name }}@${{ steps.proto.outputs.version }} 가 10분 안에 레지스트리에 보이지 않습니다. publish 는 성공했을 수 있으니 npm 쪽 상태를 확인하세요."
            exit 1
          fi
          TMP=$(mktemp -d); cd "$TMP"
          npm init -y >/dev/null
          npm i "${{ steps.proto.outputs.name }}@${{ steps.proto.outputs.version }}"
          node --input-type=module -e "
            import * as root from '${{ steps.proto.outputs.name }}';
            import * as browser from '${{ steps.proto.outputs.name }}/browser';
            if (!Object.keys(root).length) throw new Error('루트 export 가 비어 있다');
            if (!Object.keys(browser).length) throw new Error('서브경로 export 가 비어 있다');
            console.log('root', Object.keys(root).length, '· browser', Object.keys(browser).length);
          "

      # ── IDE 보기 (xgen-dex-ide) ─────────────────────────────────────
      #
      # 채팅 [IDE] 의 화면·상태를 웹(xgen-frontend)도 같은 코드로 쓴다. 데스크톱은 모노레포 안에서
      # `@dex/ide` 소스를 그대로 번들하고, 웹은 이 배포물(JS + .d.ts + CSS 한 벌)을 받는다.
      - name: IDE 빌드
        run: npm --prefix packages/ide run build

      - name: IDE — 이미 올라간 버전인지 확인
        id: ide
        run: |
          NAME=$(node -p "require('./packages/ide/dist-pkg/package.json').name")
          VER=$(node -p "require('./packages/ide/dist-pkg/package.json').version")
          echo "name=$NAME"   >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER 는 이미 npm 에 있습니다 — 배포를 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: IDE 배포
        if: steps.ide.outputs.exists == 'false'
        working-directory: packages/ide/dist-pkg
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: IDE — 설치해서 실제로 불러 본다
        if: steps.ide.outputs.exists == 'false'
        run: |
          # 프로토콜과 같은 이유로 보일 때까지 기다린 뒤, 깨끗한 곳에 깔아 루트와 CSS 가 풀리는지 본다.
          seen=""
          for i in $(seq 1 40); do
            if npm view --prefer-online "${{ steps.ide.outputs.name }}@${{ steps.ide.outputs.version }}" version >/dev/null 2>&1; then
              seen=1
              echo "레지스트리 반영 확인 (약 $(( (i - 1) * 15 ))초 대기)"
              break
            fi
            sleep 15
          done
          if [ -z "$seen" ]; then
            echo "::error::${{ steps.ide.outputs.name }}@${{ steps.ide.outputs.version }} 가 10분 안에 레지스트리에 보이지 않습니다. publish 는 성공했을 수 있으니 npm 쪽 상태를 확인하세요."
            exit 1
          fi
          TMP=$(mktemp -d); cd "$TMP"
          npm init -y >/dev/null
          npm i "${{ steps.ide.outputs.name }}@${{ steps.ide.outputs.version }}" react@18 react-dom@18
          node --input-type=module -e "
            import * as ide from '${{ steps.ide.outputs.name }}';
            import { createRequire } from 'node:module';
            const require = createRequire(import.meta.url);
            for (const k of ['IdeView', 'IdeStore', 'IdeError']) if (!(k in ide)) throw new Error(k + ' export 가 없다');
            if (!require.resolve('${{ steps.ide.outputs.name }}/ide.css')) throw new Error('ide.css 가 없다');
            console.log('exports', Object.keys(ide).length, '· css ok');
          "

  publish:
    name: 릴리스 발행
    # ios 를 needs 에 넣되 결과는 보지 않는다 — ipa 가 나왔으면 릴리스에 싣고,
    # iOS 가 실패했어도(비차단 설계) 나머지 자산으로 릴리스는 발행한다.
    # ios 를 기다리지 않으면 ipa 아티팩트가 릴리스에 못 붙는다(v1.25.1 실측).
    needs: [prepare, desktop, xd, packages, android, ios]
    if: >-
      always() && needs.desktop.result == 'success' && needs.xd.result == 'success' &&
      needs.packages.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 버전 읽기
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: XGEN Dex v${{ steps.ver.outputs.version }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          body: |
            **XGEN Dex** — 데스크톱 · CLI · VSCode 확장. 셋 다 같은 코어에서 나왔고,
            이 태그는 **함께 검증된 조합**입니다.

            ### 데스크톱

            | OS | 파일 | 설치 |
            |---|---|---|
            | Windows | `XGen-Dex-Setup-*.exe` | 실행 → SmartScreen 이 뜨면 **추가 정보 → 실행** |
            | macOS | `XGen-Dex-*.dmg` | 열어서 **XGen-Dex.app** 을 **응용 프로그램**으로 → 첫 실행은 **우클릭 → 열기** |
            | Linux | `XGen-Dex-*.AppImage` / `XGen-Dex-*.deb` | AppImage: `chmod +x` 후 실행 / deb: `sudo dpkg -i` |

            > macOS 가 "손상됨" 이라고 하면:
            > `xattr -dr com.apple.quarantine "/Applications/XGen-Dex.app"`

            ### XD — 서버 없이 이 PC 에서 에이전트를 돌리는 앱

            XGEN 서버에 붙지 않고, 에이전트가 **이 PC 에서** 돕니다(실행 엔진이 설치본에 들어 있습니다). AI 제공자는
            API 키(Anthropic·OpenAI·Gemini·OpenAI 호환 서버) 또는 Claude Code·Codex 로그인을 씁니다.

            | OS | 파일 | 설치 |
            |---|---|---|
            | Windows | `XGen-XD-Setup-*.exe` | 실행 → 설치 위치를 고릅니다(기본 `…\Programs\XD`, 그 안에 에이전트의 작업 공간이 생깁니다). SmartScreen 이 뜨면 **추가 정보 → 실행** |
            | macOS (Apple 실리콘) | `XGen-XD-*-arm64.dmg` | 열어서 **XD.app** 을 **응용 프로그램**으로 옮긴 뒤 터미널에서 아래 한 줄 |
            | macOS (Intel) | `XGen-XD-*-x64.dmg` | 위와 같습니다 |
            | Linux | `XGen-XD-*.AppImage` / `XGen-XD-*.deb` | AppImage: `chmod +x` 후 실행 / deb: `sudo dpkg -i` |

            > macOS: XD 는 실행 엔진(Python)을 함께 실어 서명 없이는 안의 실행 파일까지 격리됩니다 — 옮긴 뒤 한 번
            > `xattr -dr com.apple.quarantine "/Applications/XD.app"` 를 실행하세요.

            작업 공간과 대화는 Windows 는 설치 폴더에, macOS·Linux 는 `~/XD` 에 남습니다 — 앱을 지우거나 새 판으로
            바꿔도 그대로입니다. Dex 와 나란히 설치됩니다.

            ### 모바일 (React Native — 안드로이드 / iOS)

            모바일 앱은 **서버 세션 채팅 + 모바일 도구** 전용입니다 — 에이전트가
            대화에 연결한 휴대폰 폴더의 파일, 알림·클립보드·카메라·위치 등(설정에서
            그룹별 승인 후)을 도구로 사용할 수 있습니다. 데스크톱의 클라우드/브라우저
            기능은 포함되지 않습니다. 버전은 데스크톱·CLI·확장과 같습니다.

            - **안드로이드**: `XGen-Dex-*.apk` 를 받아 설치합니다 (알 수 없는 앱
              설치 허용 필요). 같은 서명 키로 릴리스되므로 **기존 설치 위에 바로
              업데이트**됩니다 (v1.21 이하에서 올라올 때만 1회 삭제 후 설치 —
              서명 키 교체).
            - **iOS**: `XGen-Dex-*-ios-unsigned.ipa` 는 무서명 빌드입니다 — Apple
              개발자 인증서로 재서명(사내 배포/TestFlight)해야 설치할 수 있습니다.

            ### CLI

            ```
            npm i -g xgen-dex-cli
            dex            # 대화형 터미널 UI
            dex --help
            ```

            npm 을 쓸 수 없는 환경이면 아래 `xgen-dex-cli-*.tgz` 를 받아
            `npm i -g ./xgen-dex-cli-*.tgz` 로 설치합니다.

            ### VSCode 확장

            `xgen-dex-vscode-*.vsix` 를 받아 **확장 → … → VSIX에서 설치**.
            확장은 CLI 엔진을 자식 프로세스로 띄웁니다 — CLI 를 먼저 설치하거나
            설정에서 실행 파일 경로를 지정하세요.

            ---

            처음 실행하면 **XGEN 서버 주소**와 **계정**을 입력합니다. 기본 서버는
            들어 있지 않습니다 — 각자의 XGEN 배포를 가리키세요.
