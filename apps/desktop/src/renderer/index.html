<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- frame-src xgenartifact: — 에이전트가 만든 아티팩트가 도는 격리 프레임
         하나. 그 문서는 자기 CSP 로 네트워크가 완전히 닫혀 있고(main 이 헤더로
         붙인다), sandbox 로 오리진이 불투명해 이 창의 window.xgen 에 닿지 못한다.
         여기서 열어 주는 것은 **문서를 띄우는 것**뿐이다. -->
    <!-- frame-src blob: — 파일 뷰어가 PDF 를 Chromium 내장 뷰어 iframe 으로 띄운다. 이 앱이 바이트로
         만든 Blob 이고 형식을 application/pdf 로 고정하므로 HTML 로 해석되지 않는다. 막혀 있어
         PDF 가 빈 화면이었다(2026-09-16). -->
    <!-- 아바타 설정 뷰가 메인 창에서 모델/사진을 렌더한다: 에셋은 전부
         main-process 프록시 스킴(xgenavatar:)으로만 로드하고(연결 목적지는
         커넥터가 아는 서버뿐), 크롭 편집기는 blob: 오브젝트 URL 을 쓴다.
         **connect-src 는 계속 닫혀 있다** — 이 창은 네트워크로 직접 말하지 않는다. -->
    <!-- frame-src https: http: — 에이전트가 띄운 아티팩트 앱을 [아티팩트] 탭에서
         연다. 그 주소는 사용자가 설정한 XGEN 서버뿐이고(ArtifactSiteFrame 이
         serverUrl 에서 만든다), 서버 주소는 http 일 수도 있다(사내망·IP·localhost →
         normalizeServerUrl). 정적 문서인 이 CSP 는 그 오리진을 미리 적을 수 없어
         스킴으로 연다.
         여는 것은 **문서를 띄우는 것**뿐이다: 프레임은 서버 오리진이라 이 창과
         교차 출처이고, window.xgen 에 닿지 못한다. connect-src 는 그대로 닫혀
         있으므로 이 창 자신이 네트워크로 나가는 길은 열리지 않는다.
         이 한 줄이 없으면 요청조차 나가지 않고 탭이 빈 화면이 된다(2026-09-18 실증,
         verify/artifact-site-frame-smoke.cjs 가 진짜 Chromium 으로 지킨다). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: xgenavatar:; media-src 'self' blob: data:; connect-src 'self' blob: data: xgenavatar:; worker-src 'self' blob:; frame-src xgenartifact: blob: https: http:"
    />
    <title>XGen Dex</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Live2D Cubism core — 아바타 미리보기(설정 뷰)용. 오버레이와 동일 파일. -->
    <script src="./live2dcubismcore.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
